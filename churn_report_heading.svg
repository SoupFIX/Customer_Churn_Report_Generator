<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a1035"/>
    <stop offset="55%" stop-color="#0a0518"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fff6d8"/>
    <stop offset="30%" stop-color="#ffd75e"/>
    <stop offset="60%" stop-color="#f5a623"/>
    <stop offset="100%" stop-color="#b9700f"/>
  </linearGradient>
  <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a78bfa"/>
    <stop offset="100%" stop-color="#2cd9c5"/>
  </linearGradient>
  <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6b6b"/>
    <stop offset="50%" stop-color="#ffd166"/>
    <stop offset="100%" stop-color="#06d6a0"/>
  </linearGradient>
  <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06d6a0"/>
    <stop offset="50%" stop-color="#ffd166"/>
    <stop offset="100%" stop-color="#ff6b6b"/>
  </linearGradient>
  <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#fff6d8"/>
    <stop offset="60%" stop-color="#ffd75e"/>
    <stop offset="100%" stop-color="#c98a12"/>
  </radialGradient>
  <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lvGrad" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#c9a6ff"/>
    <stop offset="100%" stop-color="#6d28d9"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="strongGlow" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="11" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="titleClip">
    <text x="450" y="205" text-anchor="middle" font-size="64" font-weight="900" font-family="'Segoe UI', Arial, sans-serif">Customer Churn</text>
  </clipPath>
  <style>
    .scene { animation: shake 0.5s ease-out; }
    @keyframes shake {
      0% { transform: translate(0,0); }
      20% { transform: translate(-4px,2px); }
      40% { transform: translate(4px,-2px); }
      60% { transform: translate(-2px,1px); }
      80% { transform: translate(2px,-1px); }
      100% { transform: translate(0,0); }
    }
    .frame { animation: frameGlow 2.2s ease-in-out infinite; }
    @keyframes frameGlow {
      0%,100% { stroke-opacity: 0.55; }
      50% { stroke-opacity: 1; }
    }
    .glowring { animation: pulse 2.4s ease-in-out infinite; transform-origin: 450px 180px; }
    @keyframes pulse {
      0%,100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.07); }
    }
    .particle { animation: orbit 6s linear infinite; transform-origin: 450px 180px; }
    .particle:nth-child(2) { animation-duration: 8s; animation-direction: reverse; }
    .particle:nth-child(3) { animation-duration: 5s; }
    .particle:nth-child(4) { animation-duration: 9s; animation-direction: reverse; }
    .particle:nth-child(5) { animation-duration: 7s; }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(430px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(430px) rotate(-360deg); }
    }
    .coin { animation: coinSpin 2.6s ease-in-out infinite, coinFloat 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes coinSpin { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.15); } }
    @keyframes coinFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    .letter { opacity: 0; animation: popin 0.7s cubic-bezier(.17,.89,.32,1.49) forwards, float 3.5s ease-in-out 1.6s infinite; }
    @keyframes popin {
      0% { opacity: 0; transform: translateY(42px) scale(0.4) rotate(-10deg); }
      60% { opacity: 1; transform: translateY(-7px) scale(1.1) rotate(3deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .shine { animation: sweep 2.6s ease-in-out infinite; }
    @keyframes sweep {
      0% { transform: translateX(-260px); opacity: 0; }
      10% { opacity: 0.95; }
      45% { opacity: 0.95; }
      60% { transform: translateX(760px); opacity: 0; }
      100% { transform: translateX(760px); opacity: 0; }
    }
    .fadeup { opacity: 0; animation: fadeup 0.8s ease forwards; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .badgePulse { animation: fadeup 0.8s ease 1.6s both, glowpulse 2s ease-in-out 2.4s infinite; }
    @keyframes glowpulse {
      0%,100% { filter: drop-shadow(0 0 4px #ffd166); }
      50% { filter: drop-shadow(0 0 16px #ffd166); }
    }
    .sparkle { animation: twinkle 1.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .xpfill { animation: fillbar 2.4s ease-out 2.2s forwards; }
    @keyframes fillbar { from { width: 0; } to { width: 560px; } }
    .lvring { animation: lvspin 6s linear infinite; transform-origin: 130px 340px; }
    @keyframes lvspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .streakflame { animation: flicker 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes flicker {
      0%,100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.12) rotate(2deg); }
    }
    .confetti { animation: fall 3.4s linear infinite; }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(420px) rotate(360deg); opacity: 0; }
    }
    .popNum { animation: popnum 2.4s ease-in 0.6s infinite; }
    @keyframes popnum {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      15% { opacity: 1; transform: translateY(-8px) scale(1.1); }
      40% { opacity: 1; transform: translateY(-26px) scale(1); }
      70% { opacity: 0; transform: translateY(-46px) scale(0.9); }
      100% { opacity: 0; }
    }
  </style>
</defs>

<rect x="0" y="0" width="900" height="420" fill="url(#bgGrad)"/>

<g class="scene">

<!-- glossy game-card frame -->
<rect class="frame" x="18" y="18" width="864" height="384" rx="26" fill="none" stroke="#8b5cf6" stroke-width="3"/>
<rect x="26" y="26" width="848" height="368" rx="20" fill="none" stroke="#ffd166" stroke-width="1" stroke-opacity="0.4"/>

<!-- confetti -->
<g>
  <rect class="confetti" x="80" y="0" width="8" height="8" fill="#ff6b6b" style="animation-delay:0s"/>
  <rect class="confetti" x="200" y="0" width="7" height="7" fill="#06d6a0" style="animation-delay:0.7s"/>
  <rect class="confetti" x="330" y="0" width="9" height="9" fill="#ffd166" style="animation-delay:1.3s"/>
  <rect class="confetti" x="560" y="0" width="7" height="7" fill="#8b5cf6" style="animation-delay:0.4s"/>
  <rect class="confetti" x="700" y="0" width="8" height="8" fill="#2cd9c5" style="animation-delay:1.9s"/>
  <rect class="confetti" x="820" y="0" width="6" height="6" fill="#ff6b6b" style="animation-delay:1.1s"/>
  <rect class="confetti" x="640" y="0" width="8" height="8" fill="#ffd166" style="animation-delay:2.4s"/>
  <rect class="confetti" x="260" y="0" width="6" height="6" fill="#06d6a0" style="animation-delay:1.6s"/>
</g>

<!-- glow ring behind title -->
<ellipse class="glowring" cx="450" cy="180" rx="390" ry="185" fill="url(#ringGrad)"/>

<!-- orbiting particles -->
<g filter="url(#softGlow)">
  <circle class="particle" cx="0" cy="0" r="5" fill="#ffd166"/>
  <circle class="particle" cx="0" cy="0" r="4" fill="#06d6a0"/>
  <circle class="particle" cx="0" cy="0" r="6" fill="#8b5cf6"/>
  <circle class="particle" cx="0" cy="0" r="3.5" fill="#ff6b6b"/>
  <circle class="particle" cx="0" cy="0" r="4.5" fill="#2cd9c5"/>
</g>

<!-- floating coins -->
<g filter="url(#softGlow)">
  <g class="coin" style="animation-delay:0s">
    <circle cx="130" cy="120" r="16" fill="url(#coinGrad)"/>
    <text x="130" y="126" text-anchor="middle" font-size="16" font-weight="900" fill="#7a4b00">$</text>
  </g>
  <g class="coin" style="animation-delay:0.5s">
    <circle cx="775" cy="150" r="13" fill="url(#coinGrad)"/>
    <text x="775" y="155" text-anchor="middle" font-size="13" font-weight="900" fill="#7a4b00">$</text>
  </g>
  <g class="coin" style="animation-delay:1s">
    <circle cx="790" cy="270" r="15" fill="url(#coinGrad)"/>
    <text x="790" y="276" text-anchor="middle" font-size="15" font-weight="900" fill="#7a4b00">$</text>
  </g>
  <g class="coin" style="animation-delay:1.4s">
    <circle cx="110" cy="270" r="14" fill="url(#coinGrad)"/>
    <text x="110" y="276" text-anchor="middle" font-size="14" font-weight="900" fill="#7a4b00">$</text>
  </g>
</g>

<!-- level badge circle, bottom-left -->
<g filter="url(#softGlow)">
  <circle class="lvring" cx="130" cy="340" r="34" fill="none" stroke="url(#pillGrad)" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="130" cy="340" r="26" fill="url(#lvGrad)"/>
  <text x="130" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#f3e8ff">LEVEL</text>
  <text x="130" y="352" text-anchor="middle" font-size="16" font-weight="900" fill="#fff6d8">42</text>
</g>

<!-- streak counter, bottom-right -->
<g class="fadeup" style="animation-delay:2s" filter="url(#softGlow)">
  <rect x="710" y="316" width="130" height="46" rx="23" fill="#241734" stroke="#ffd166" stroke-width="1.5"/>
  <text class="streakflame" x="732" y="346" text-anchor="middle" font-size="20">🔥</text>
  <text x="785" y="341" text-anchor="middle" font-size="12" fill="#ffd166" font-weight="700">7 DAY</text>
  <text x="785" y="356" text-anchor="middle" font-size="12" fill="#f3e8ff" font-weight="700">STREAK</text>
</g>

<!-- floating +XP popups -->
<text class="popNum" x="650" y="140" font-size="15" font-weight="800" fill="#06d6a0" style="animation-delay:0.3s">+250 XP</text>
<text class="popNum" x="200" y="180" font-size="14" font-weight="800" fill="#ffd166" style="animation-delay:1.4s">+1 COIN</text>

<!-- corner tags -->
<g class="fadeup" style="animation-delay:1.9s">
  <rect x="60" y="46" width="128" height="30" rx="15" fill="url(#pillGrad)"/>
  <text x="124" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#241734">⚡ LEVEL UP</text>
</g>
<g class="fadeup" style="animation-delay:2.1s">
  <rect x="712" y="46" width="128" height="30" rx="15" fill="url(#pillGrad)"/>
  <text x="776" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#241734">🎯 LIVE INSIGHTS</text>
</g>

<!-- sparkles -->
<g fill="#ffe9a8">
  <text class="sparkle" x="100" y="150" font-size="20" style="animation-delay:0.2s">✦</text>
  <text class="sparkle" x="810" y="120" font-size="16" style="animation-delay:0.6s">✦</text>
  <text class="sparkle" x="160" y="250" font-size="15" style="animation-delay:1s">✦</text>
  <text class="sparkle" x="740" y="250" font-size="22" style="animation-delay:1.4s">✦</text>
  <text class="sparkle" x="450" y="90" font-size="17" style="animation-delay:0.8s">✦</text>
</g>

<!-- MAIN TITLE line 1: Customer Churn -->
<g filter="url(#strongGlow)">
  <text x="450" y="205" text-anchor="middle" font-size="64" font-weight="900"
        font-family="'Segoe UI', Arial, sans-serif" fill="url(#goldGrad)"
        stroke="#5a2d00" stroke-width="1.5" paint-order="stroke">
    <tspan class="letter" style="animation-delay:0.05s">C</tspan><tspan class="letter" style="animation-delay:0.1s">u</tspan><tspan class="letter" style="animation-delay:0.15s">s</tspan><tspan class="letter" style="animation-delay:0.2s">t</tspan><tspan class="letter" style="animation-delay:0.25s">o</tspan><tspan class="letter" style="animation-delay:0.3s">m</tspan><tspan class="letter" style="animation-delay:0.35s">e</tspan><tspan class="letter" style="animation-delay:0.4s">r</tspan><tspan class="letter" style="animation-delay:0.45s"> </tspan><tspan class="letter" style="animation-delay:0.5s">C</tspan><tspan class="letter" style="animation-delay:0.55s">h</tspan><tspan class="letter" style="animation-delay:0.6s">u</tspan><tspan class="letter" style="animation-delay:0.65s">r</tspan><tspan class="letter" style="animation-delay:0.7s">n</tspan>
  </text>
</g>

<!-- shine sweep clipped to title -->
<g clip-path="url(#titleClip)">
  <rect class="shine" x="0" y="120" width="90" height="120" fill="#ffffff" opacity="0.65" transform="skewX(-20)"/>
</g>

<!-- MAIN TITLE line 2: Report Generator -->
<g filter="url(#strongGlow)">
  <text x="450" y="276" text-anchor="middle" font-size="50" font-weight="800"
        font-family="'Segoe UI', Arial, sans-serif" fill="url(#purpleGrad)"
        stroke="#0d0620" stroke-width="1.2" paint-order="stroke">
    <tspan class="letter" style="animation-delay:0.75s">R</tspan><tspan class="letter" style="animation-delay:0.79s">e</tspan><tspan class="letter" style="animation-delay:0.83s">p</tspan><tspan class="letter" style="animation-delay:0.87s">o</tspan><tspan class="letter" style="animation-delay:0.91s">r</tspan><tspan class="letter" style="animation-delay:0.95s">t</tspan><tspan class="letter" style="animation-delay:0.99s"> </tspan><tspan class="letter" style="animation-delay:1.03s">G</tspan><tspan class="letter" style="animation-delay:1.07s">e</tspan><tspan class="letter" style="animation-delay:1.11s">n</tspan><tspan class="letter" style="animation-delay:1.15s">e</tspan><tspan class="letter" style="animation-delay:1.19s">r</tspan><tspan class="letter" style="animation-delay:1.23s">a</tspan><tspan class="letter" style="animation-delay:1.27s">t</tspan><tspan class="letter" style="animation-delay:1.31s">o</tspan><tspan class="letter" style="animation-delay:1.35s">r</tspan>
  </text>
</g>

<!-- glossy highlight strip -->
<rect x="70" y="100" width="760" height="30" rx="15" fill="#ffffff" opacity="0.06"/>

<!-- star rating -->
<g class="fadeup" style="animation-delay:1.7s" fill="#ffd166">
  <text x="360" y="300" font-size="18">★</text>
  <text x="385" y="300" font-size="18">★</text>
  <text x="410" y="300" font-size="18">★</text>
  <text x="435" y="300" font-size="18">★</text>
  <text x="460" y="300" font-size="18">★</text>
  <text x="490" y="299" font-size="12" fill="#f3e8ff" font-weight="700">TOP RATED TOOL</text>
</g>

<!-- subtitle badge -->
<g class="badgePulse">
  <rect x="290" y="316" width="320" height="34" rx="17" fill="url(#pillGrad)"/>
</g>
<text class="fadeup" style="animation-delay:1.8s" x="450" y="339" text-anchor="middle" font-size="14" font-weight="700" fill="#241734">🏆 PREDICT · RETAIN · WIN BACK</text>

<!-- XP progress bar -->
<rect x="170" y="380" width="560" height="10" rx="5" fill="#241734" opacity="0.6"/>
<rect class="xpfill" x="170" y="380" height="10" rx="5" fill="url(#xpGrad)"/>
<text x="450" y="374" text-anchor="middle" font-size="10" fill="#c9a6ff" font-weight="700">XP TO NEXT INSIGHT LEVEL</text>

</g>
</svg>
