<svg width="100%" viewBox="0 0 1680 940" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Arial, sans-serif" role="img">
<title>Raw data in, boardroom-ready report out - animated pipeline</title>
<desc>An animated diagram showing a data pipeline: intake, validation, cleaning, visual generation, and an AI report writer, ending in a delivered PDF.</desc>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b0f1c"/>
    <stop offset="55%" stop-color="#0c1120"/>
    <stop offset="100%" stop-color="#12112a"/>
  </linearGradient>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.6"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#f97066" stroke-width="1.6"/>
  </marker>
  <path id="fullPath" d="M140,630 L380,630 L660,630 L900,630 L1120,630 L1340,630 L1520,630 C1520,560 1520,500 1520,475" fill="none"/>
  <path id="rejectPath" d="M380,705 C420,790 200,790 140,700" fill="none"/>
</defs>

<style>
  .eyebrow{fill:#ff8a5c;font-size:13px;font-weight:700;letter-spacing:2px;}
  .title{fill:#f5f5f7;font-size:38px;font-weight:700;}
  .titleAccent{fill:#ff6a3d;font-size:38px;font-weight:700;}
  .subtitle{fill:#9aa3b8;font-size:15px;}
  .legendTxt{fill:#c3cadb;font-size:13px;}
  .stageLabel{fill:#8891a8;font-size:11px;letter-spacing:1px;}
  .stageTitle{fill:#f0f2f6;font-size:14px;font-weight:600;}
  .boxTxt{fill:#aeb6cc;font-size:11px;}
  .cardNum{fill:#ff8a5c;font-size:12px;font-weight:700;}
  .cardTitle{fill:#eef0f5;font-size:14px;font-weight:600;}
  .rejectLbl{fill:#f97066;font-size:11px;}
  .star{fill:#fff;opacity:.35;}
  .twinkle{animation:tw 3.2s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
  .flow{stroke-dasharray:8 8;animation:march 1s linear infinite;}
  @keyframes march{to{stroke-dashoffset:-32;}}
  .badge{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.25);}}
  .ring1{animation:ringPulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box;}
  .ring2{animation:ringPulse 2.2s ease-out infinite .7s;transform-origin:center;transform-box:fill-box;}
  @keyframes ringPulse{0%{opacity:.9;transform:scale(.4);}80%{opacity:0;transform:scale(1.6);}100%{opacity:0;}}
  .aiDot{animation:aiBlink 1.4s ease-in-out infinite;}
  @keyframes aiBlink{0%,100%{opacity:1}50%{opacity:.4}}
  .bar1{animation:bar1 2.4s ease-in-out infinite;transform-origin:bottom;transform-box:fill-box;}
  .bar2{animation:bar2 2.4s ease-in-out infinite .2s;transform-origin:bottom;transform-box:fill-box;}
  .bar3{animation:bar3 2.4s ease-in-out infinite .4s;transform-origin:bottom;transform-box:fill-box;}
  .bar4{animation:bar4 2.4s ease-in-out infinite .6s;transform-origin:bottom;transform-box:fill-box;}
  @keyframes bar1{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
  @keyframes bar2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
  @keyframes bar3{0%,100%{transform:scaleY(.75)}50%{transform:scaleY(1)}}
  @keyframes bar4{0%,100%{transform:scaleY(.9)}50%{transform:scaleY(.5)}}
  .spin{animation:spin 3s linear infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .clean-dot{animation:cleanMove 2.4s ease-in-out infinite;}
  @keyframes cleanMove{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}
  .blink{animation:blk 1.8s ease-in-out infinite;}
  @keyframes blk{0%,100%{opacity:1}50%{opacity:.2}}
  .row-highlight{animation:rowMove 3.2s steps(4) infinite;}
  @keyframes rowMove{0%{transform:translateY(0)}25%{transform:translateY(18px)}50%{transform:translateY(36px)}75%{transform:translateY(54px)}100%{transform:translateY(0)}}
  .machineDot{animation:mBlink 1s ease-in-out infinite;}
  @keyframes mBlink{0%,100%{opacity:1}50%{opacity:.3}}
  .node{transition:filter .3s;}
  .lit{filter:drop-shadow(0 0 14px #34d399);}
  .lit .nodeStroke{stroke:#34d399 !important;stroke-width:2 !important;}
  .card{transition:filter .3s;}
  .cardLit{filter:drop-shadow(0 0 12px #ff6a3d);}
  .cardLit rect.cardBg{stroke:#ff6a3d !important;}
  .runBtn{cursor:pointer;}
  .runBtn:hover rect{fill:#ff7d51;}
  .runBtn.disabled{opacity:.5;pointer-events:none;}
  .deliveredGlow{filter:drop-shadow(0 0 0 rgba(0,0,0,0));transition:filter .6s;}
  .delivered{filter:drop-shadow(0 0 18px #2dd4bf);}
  .check{opacity:0;transition:opacity .5s;}
  .check.show{opacity:1;}
</style>

<rect x="0" y="0" width="1680" height="940" fill="url(#bgGrad)"/>

<g>
<circle class="star" cx="120" cy="60" r="1.4"/><circle class="star twinkle" cx="300" cy="40" r="1.6"/>
<circle class="star" cx="520" cy="80" r="1.2"/><circle class="star twinkle" cx="760" cy="30" r="1.5"/>
<circle class="star" cx="980" cy="55" r="1.3"/><circle class="star twinkle" cx="1180" cy="45" r="1.6"/>
<circle class="star" cx="1380" cy="70" r="1.2"/><circle class="star twinkle" cx="1560" cy="35" r="1.5"/>
<circle class="star" cx="900" cy="120" r="1.1"/><circle class="star" cx="1450" cy="150" r="1.3"/>
<circle class="star twinkle" cx="1600" cy="120" r="1.4"/><circle class="star" cx="60" cy="150" r="1.2"/>
</g>

<text x="40" y="52" class="eyebrow">INTERACTIVE SYSTEMS SHOWCASE</text>
<text x="40" y="98"><tspan class="title">Raw data in. </tspan><tspan class="titleAccent">Boardroom-ready report out.</tspan></text>
<text x="40" y="130" class="subtitle"><tspan x="40" dy="0">A fully automated line that ingests messy CSV, XLSX, and JSON files, validates and cleans them,</tspan></text>
<text x="40" y="152" class="subtitle"><tspan x="40" dy="0">generates visuals, and hands off to an AI model that writes the report - with a self-correcting</tspan></text>
<text x="40" y="174" class="subtitle"><tspan x="40" dy="0">loop for bad input. Click run to watch the whole line work.</tspan></text>

<g class="runBtn" id="runBtnGroup" onclick="window.runPipeline()">
  <rect x="40" y="200" width="190" height="46" rx="8" fill="#ff6a3d"/>
  <text x="70" y="229" fill="#fff" font-size="14" font-weight="700">&#9654; Run pipeline</text>
</g>

<circle cx="255" cy="223" r="5" fill="#34d399"/><text x="266" y="228" class="legendTxt">valid file flow</text>
<circle cx="410" cy="223" r="5" fill="#f97066"/><text x="421" y="228" class="legendTxt">rejected &amp; recycled</text>
<circle cx="590" cy="223" r="5" fill="#2dd4bf"/><text x="601" y="228" class="legendTxt">AI processing</text>
<circle class="machineDot" cx="730" cy="223" r="5" fill="#ff8a5c"/><text x="741" y="228" class="legendTxt">machine active</text>

<rect x="30" y="330" width="1620" height="480" rx="18" fill="#10162a" stroke="#232a40" stroke-width="1"/>

<path class="flow" d="M140,630 L380,630 L660,630 L900,630 L1120,630 L1340,630 L1520,630" fill="none" stroke="#2c6e57" stroke-width="2"/>
<path d="M1520,630 C1520,560 1520,500 1520,475" fill="none" stroke="#2c6e57" stroke-width="2" stroke-dasharray="8 8" class="flow"/>
<circle r="4" fill="#34d399"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#fullPath"/></animateMotion></circle>
<circle r="4" fill="#34d399"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#fullPath"/></animateMotion></circle>
<circle r="4" fill="#34d399"><animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite"><mpath href="#fullPath"/></animateMotion></circle>

<path d="M380,705 C420,790 200,790 140,700" fill="none" stroke="#7a3230" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrowRed)"/>
<circle r="4" fill="#f97066"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.55;0.92;1" calcMode="linear"><mpath href="#rejectPath"/></animateMotion></circle>
<text x="150" y="770" class="rejectLbl">wrong or corrupt format &#8594; recycled to worker 1</text>

<circle id="carrier" r="7" fill="#ffd9c9" opacity="0">
  <animateMotion id="carrierAnim" dur="4s" begin="indefinite" fill="freeze"><mpath href="#fullPath"/></animateMotion>
</circle>

<g id="n1" class="node">
  <text x="140" y="530" text-anchor="middle" class="stageLabel">STAGE 1</text>
  <text x="140" y="546" text-anchor="middle" class="stageTitle">Worker 1 &#183; intake</text>
  <rect class="nodeStroke" x="85" y="565" width="110" height="130" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <circle class="badge" cx="105" cy="590" r="6" fill="#ff8a5c"/>
  <circle cx="140" cy="615" r="12" fill="#5c6a92"/>
  <path d="M118,660 Q140,635 162,660 L162,680 L118,680 Z" fill="#5c6a92"/>
</g>

<g id="n2" class="node">
  <text x="380" y="520" text-anchor="middle" class="stageLabel">STAGE 2</text>
  <text x="380" y="536" text-anchor="middle" class="stageTitle">Ingestion &amp; type check</text>
  <rect class="nodeStroke" x="270" y="555" width="220" height="150" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <g clip-path="none">
    <rect x="286" y="571" width="188" height="18" rx="3" fill="#243056" class="row-highlight"/>
  </g>
  <text x="296" y="584" class="boxTxt">.csv</text>
  <text x="296" y="606" class="boxTxt">.xlsx</text>
  <text x="296" y="628" class="boxTxt">.json</text>
  <text x="296" y="650" class="boxTxt">.xls</text>
  <circle class="badge" cx="480" cy="630" r="5" fill="#34d399"/>
</g>

<g id="n3" class="node">
  <text x="660" y="520" text-anchor="middle" class="stageLabel">STAGE 3</text>
  <text x="660" y="536" text-anchor="middle" class="stageTitle">Cleaning unit</text>
  <rect class="nodeStroke" x="550" y="555" width="220" height="150" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <text x="700" y="580" class="boxTxt">dedupe</text>
  <text x="700" y="598" class="boxTxt">fix columns</text>
  <text x="700" y="616" class="boxTxt">fill nulls</text>
  <text x="700" y="634" class="boxTxt">fix dtypes</text>
  <text x="700" y="652" class="boxTxt">handle outliers</text>
  <g class="clean-dot"><circle cx="575" cy="670" r="5" fill="#ff8a5c"/></g>
  <rect class="blink" x="600" y="660" width="8" height="8" fill="#ff8a5c"/>
  <rect class="blink" x="615" y="670" width="8" height="8" fill="#ff8a5c" style="animation-delay:.6s"/>
</g>

<g id="n4" class="node">
  <text x="900" y="530" text-anchor="middle" class="stageLabel">STAGE 4</text>
  <text x="900" y="546" text-anchor="middle" class="stageTitle">Worker 2 &#183; handoff</text>
  <rect class="nodeStroke" x="845" y="565" width="110" height="130" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <circle class="badge" cx="920" cy="590" r="6" fill="#2dd4bf"/>
  <circle cx="900" cy="615" r="12" fill="#5c6a92"/>
  <path d="M878,660 Q900,635 922,660 L922,680 L878,680 Z" fill="#5c6a92"/>
</g>

<g id="n5" class="node">
  <text x="1120" y="520" text-anchor="middle" class="stageLabel">STAGE 5</text>
  <text x="1120" y="536" text-anchor="middle" class="stageTitle">Visual generation unit</text>
  <rect class="nodeStroke" x="1010" y="555" width="220" height="150" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <rect class="bar1" x="1040" y="640" width="20" height="40" fill="#a78bfa"/>
  <rect class="bar2" x="1070" y="620" width="20" height="60" fill="#a78bfa"/>
  <rect class="bar3" x="1100" y="630" width="20" height="50" fill="#a78bfa"/>
  <rect class="bar4" x="1130" y="610" width="20" height="70" fill="#a78bfa"/>
  <g class="spin" style="transform-box:fill-box;transform-origin:1195px 630px;">
    <path d="M1195,610 A20,20 0 1 1 1178,640" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  </g>
</g>

<g id="n6" class="node">
  <text x="1340" y="530" text-anchor="middle" class="stageLabel">STAGE 6</text>
  <text x="1340" y="546" text-anchor="middle" class="stageTitle">Worker 3 &#183; handoff</text>
  <rect class="nodeStroke" x="1285" y="565" width="110" height="130" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <circle class="badge" cx="1360" cy="590" r="6" fill="#a78bfa"/>
  <circle cx="1340" cy="615" r="12" fill="#5c6a92"/>
  <path d="M1318,660 Q1340,635 1362,660 L1362,680 L1318,680 Z" fill="#5c6a92"/>
</g>

<g id="n7" class="node">
  <text x="1520" y="520" text-anchor="middle" class="stageLabel">STAGE 7</text>
  <text x="1520" y="536" text-anchor="middle" class="stageTitle">AI report model</text>
  <rect class="nodeStroke" x="1410" y="555" width="220" height="150" rx="10" fill="#161d33" stroke="#2a3350" stroke-width="1"/>
  <circle class="ring1" cx="1520" cy="630" r="28" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <circle class="ring2" cx="1520" cy="630" r="28" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <circle class="aiDot" cx="1520" cy="630" r="8" fill="#2dd4bf"/>
</g>

<g id="n8" class="node deliveredGlow">
  <text x="1600" y="360" text-anchor="middle" class="stageLabel">STAGE 8</text>
  <text x="1600" y="376" text-anchor="middle" class="stageTitle">Report delivered</text>
  <rect id="monitorRect" class="nodeStroke" x="1520" y="390" width="160" height="90" rx="8" fill="#161d33" stroke="#2a3350" stroke-width="1.5"/>
  <rect x="1580" y="480" width="40" height="8" fill="#2a3350"/>
  <path id="checkMark" class="check" d="M1570,435 L1590,455 L1630,415" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="c1" class="card"><rect class="cardBg" x="40" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="60" y="858" class="cardNum">01</text><text x="60" y="880" class="cardTitle">Ingest raw data</text></g>
<g id="c2" class="card"><rect class="cardBg" x="312" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="332" y="858" class="cardNum">02</text><text x="332" y="880" class="cardTitle">Validate file type</text></g>
<g id="c3" class="card"><rect class="cardBg" x="584" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="604" y="858" class="cardNum">03</text><text x="604" y="880" class="cardTitle">Clean &amp; normalize</text></g>
<g id="c4" class="card"><rect class="cardBg" x="856" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="876" y="858" class="cardNum">04</text><text x="876" y="880" class="cardTitle">Generate visuals</text></g>
<g id="c5" class="card"><rect class="cardBg" x="1128" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="1148" y="858" class="cardNum">05</text><text x="1148" y="880" class="cardTitle">AI writes the report</text></g>
<g id="c6" class="card"><rect class="cardBg" x="1400" y="830" width="256" height="72" rx="10" fill="#141a30" stroke="#232a40"/><text x="1420" y="858" class="cardNum">06</text><text x="1420" y="880" class="cardTitle">Deliver as PDF</text></g>

<script><![CDATA[
window.runPipeline = function() {
  var btn = document.getElementById('runBtnGroup');
  if (btn.classList.contains('disabled')) return;
  btn.classList.add('disabled');

  var nodes = ['n1','n2','n3','n4','n5','n6','n7','n8'];
  var nodeDelays = [0,620,1350,1980,2550,3130,3600,4000];
  var cardMap = {0:'c1',1:'c2',2:'c3',4:'c4',6:'c5',7:'c6'};

  nodes.forEach(function(id, i){
    setTimeout(function(){
      document.getElementById(id).classList.add('lit');
      var cid = cardMap[i];
      if (cid) document.getElementById(cid).classList.add('cardLit');
    }, nodeDelays[i]);
  });

  var carrier = document.getElementById('carrier');
  carrier.setAttribute('opacity','1');
  document.getElementById('carrierAnim').beginElement();
  setTimeout(function(){ carrier.setAttribute('opacity','0'); }, 4050);

  setTimeout(function(){
    document.getElementById('n8').classList.add('delivered');
    document.getElementById('checkMark').classList.add('show');
  }, 4100);

  setTimeout(function(){
    nodes.forEach(function(id){ document.getElementById(id).classList.remove('lit'); });
    Object.keys(cardMap).forEach(function(k){ document.getElementById(cardMap[k]).classList.remove('cardLit'); });
    document.getElementById('n8').classList.remove('delivered');
    document.getElementById('checkMark').classList.remove('show');
    btn.classList.remove('disabled');
  }, 7200);
};
]]></script>
</svg>
